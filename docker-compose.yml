services:
  backend:
    build: ./backend
    image: jamespa001/myrestaurant-backend:latest
    ports:
      - '5000:3000'
    environment:
      - NODE_ENV=production

  frontend:
    build: ./frontend
    image: jamespa001/myrestaurant-frontend:latest
    ports:
      - '8080:80'
    depends_on:
      - backend
